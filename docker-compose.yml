version: '3.8'

services:
  geospatial-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial_measurement_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - PROJECT_NAME=Geospatial File Measurement API
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
